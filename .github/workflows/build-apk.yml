name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
        env:
          FOLDBOOK_KEY_PASSWORD: ${{ secrets.FOLDBOOK_KEY_PASSWORD }}

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|AAPT|Execution failed" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: FoldBook-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk FoldBook.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FoldBook (latest)
          files: FoldBook.apk
          make_latest: true
